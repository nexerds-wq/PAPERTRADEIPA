name: NVDA Multi ORB Independent Backtest

on:
  push:
    branches:
      - backtest-nvda-v3
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Search multi-range ORB
        run: python backtest/nvda_multi_orb_search.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-multi-orb-results
          path: |
            nvda_multi_orb_results.csv
            nvda_multi_orb_winner.csv
          if-no-files-found: warn
