name: NVDA V3 Independent Backtest

on:
  push:
    branches:
      - backtest-nvda-v3
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Run V3 independent backtest
        run: python backtest/nvda_v3_backtest.py

      - name: Search researched strategy families
        run: python backtest/nvda_strategy_search.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-v3-backtest-results
          path: |
            nvda_v3_summary.csv
            nvda_v3_trades.csv
            nvda_search_best_params.csv
          if-no-files-found: warn
