name: NVDA Adaptive Independent Backtest

on:
  push:
    branches:
      - backtest-nvda-v3
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests

      - name: Search adaptive researched strategy
        run: python backtest/nvda_adaptive_search.py

      - name: Upload adaptive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvda-adaptive-search-results
          path: |
            nvda_adaptive_search_results.csv
            nvda_adaptive_winner.csv
          if-no-files-found: warn
