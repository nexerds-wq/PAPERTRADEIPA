name: Build NEXER Repair IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: nexer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Windows agent syntax and safety
        run: |
          python3 -m py_compile WindowsAgent/nexer_agent.py WindowsAgent/nexer_desktop.py
          python3 -m unittest discover -s WindowsAgent -p 'test_*.py' -v

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project NexerPaperTrader.xcodeproj \
            -scheme NexerPaperTrader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP_PATH" || { echo "Built app not found"; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload NEXER-Repair-Unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXER-Repair-Unsigned-IPA
          path: NEXER-Repair-Unsigned.ipa
          compression-level: 0
          if-no-files-found: error
