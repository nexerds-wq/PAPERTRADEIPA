name: Build NexerPaperTrader IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "CURRENT DIRECTORY:"
          pwd

          echo "PROJECT FILES:"
          find . -name "*.xcodeproj" -print

          echo "ALL FILES:"
          find . -maxdepth 4 -type f | sort

      - name: Find Xcode project
        run: |
          PROJECT=$(find . -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj was found anywhere in the repository."
            exit 1
          fi

          echo "Found project: $PROJECT"
          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: Find scheme
        run: |
          echo "Available schemes:"
          xcodebuild -project "$PROJECT_PATH" -list

      - name: Build unsigned iPhone app
        run: |
          rm -rf build
          mkdir -p build

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme NexerPaperTrader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find built app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built .app could not be found."
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/

          zip -r NexerPaperTrader-Unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexerPaperTrader-Unsigned-IPA
          path: NexerPaperTrader-Unsigned.ipa
