name: Build NexerPaperTrader IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Show project files
        run: |
          pwd
          find . -maxdepth 3 -type f | sort

      - name: Clean build folder
        run: |
          rm -rf build
          mkdir -p build

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project NexerPaperTrader.xcodeproj \
            -scheme NexerPaperTrader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find built app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Could not find built .app"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r NexerPaperTrader-Unsigned.ipa Payload

          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexerPaperTrader-Unsigned-IPA
          path: NexerPaperTrader-Unsigned.ipa
