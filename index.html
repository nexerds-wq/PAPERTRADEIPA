<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexer Gold Auto</title><style>body{font-family:system-ui;background:#090b10;color:#eef2f7;margin:0;padding:24px}.card{max-width:700px;margin:auto;background:#11151d;border:1px solid #293140;border-radius:18px;padding:24px}h1{margin-top:0}.price{font-size:42px;font-weight:800}.muted{color:#929bad}button{padding:14px 18px;border-radius:12px;border:1px solid #47632f;background:#27341e;color:white;font-size:16px}#log{white-space:pre-wrap;margin-top:18px}</style></head><body><div class="card"><h1>NEXER GOLD AUTO</h1><p class="muted">Keyless gold paper-trading test</p><div class="price" id="price">—</div><p>Signal: <b id="signal">WAIT</b></p><button onclick="start()">START AUTO</button><div id="log">Ready.</div><p class="muted">Paper trading only. The public feed may be delayed or unavailable. No fake prices are substituted.</p></div><script>let timer;async function tick(){const out=document.getElementById('log');try{out.textContent='Loading live market data…';const u='https://query1.finance.yahoo.com/v8/finance/chart/GC%3DF?range=1d&interval=1m&includePrePost=true';const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(u);const r=await fetch(proxy,{cache:'no-store'});if(!r.ok)throw Error('feed HTTP '+r.status);const j=await r.json();const z=j.chart.result[0],q=z.indicators.quote[0],ts=z.timestamp;let bars=[];for(let i=0;i<ts.length;i++){if([q.open[i],q.high[i],q.low[i],q.close[i]].every(Number.isFinite))bars.push({o:q.open[i],h:q.high[i],l:q.low[i],c:q.close[i]})}if(bars.length<30)throw Error('not enough candles');const last=bars.at(-1),prev=bars.at(-2),base=bars.slice(-23,-3),hi=Math.max(...base.map(x=>x.h)),lo=Math.min(...base.map(x=>x.l));let s='WAIT';if(last.h>hi&&last.c<hi&&last.c<prev.l)s='SELL';if(last.l<lo&&last.c>lo&&last.c>prev.h)s='BUY';document.getElementById('price').textContent='$'+last.c.toFixed(2);document.getElementById('signal').textContent=s;out.textContent='Feed connected • '+bars.length+' one-minute candles • strategy scanning automatically';}catch(e){out.textContent='Feed error: '+e.message+'\nNo fake prices used.'}}function start(){clearInterval(timer);tick();timer=setInterval(tick,10000)}tick();</script></body></html>
